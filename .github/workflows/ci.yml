name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests y paquete (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm run typecheck
      # Los tests usan un DOM falso: nunca abren un navegador ni van a la red. El de paridad con la
      # página alojada se saltea acá (necesita el código de la web al lado); el del snapshot del
      # protocolo (test/protocol.snapshot.json) corre siempre.
      - run: npm test
      - run: npm run build
      - run: npm run check:package
      - name: Contenido del paquete
        run: npm pack --dry-run
